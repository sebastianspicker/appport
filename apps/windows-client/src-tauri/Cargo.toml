[package]
name = "relution-appport"
version = "0.1.0-alpha.4"
description = "Self-service software for managed Windows devices."
edition = "2021"

[lib]
name = "relution_appport_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "relution-appport"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
rand = "=0.9.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }
url = "=2.5.8"

[[bin]]
name = "relution-appport-qualification"
path = "src/bin/qualification.rs"

[target.'cfg(windows)'.dependencies]
# Kept target-specific: the Win32 bindings must not activate Windows async
# projection crates while the portable core is being checked on macOS/Linux.
windows = { version = "=0.61.3", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }
rpassword = "=7.5.0"
open = "=5.4.0"
sys-locale = "=0.3.2"
winreg = "=0.56.0"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }
url = "=2.5.8"
