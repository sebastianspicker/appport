      <rect x="26" y="178" width="138" height="32" rx="4" fill="#edf4ff"/>
      <rect x="26" y="178" width="4" height="32" fill="#1559b0"/>
      <text x="42" y="199" font-size="13" fill="#35445a">Version 1.108</text>
      <rect x="26" y="250" width="314" height="44" rx="7" fill="#1559b0"/>
      <text x="183" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Install</text>
