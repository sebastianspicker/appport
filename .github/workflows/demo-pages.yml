name: Demo Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/demo-pages.yml"
      - "apps/web-demo/**"
      - "apps/windows-client/src-tauri/tauri.conf.json"
      - "eslint.config.mjs"
      - "jscpd.demo.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "quality-duplication-baseline.json"
      - "scripts/check-duplicates.mjs"
      - "scripts/check-source-size.mjs"
      - "scripts/verify-demo-artifact.mjs"
      - "stylelint.config.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      # actions/setup-node v6.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:verify
      # actions/configure-pages v5.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      # actions/upload-pages-artifact v4.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: apps/web-demo/dist

  deploy:
    name: Deploy demo
    needs: build
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # actions/deploy-pages v4.
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
