name: Verify

on:
  pull_request:
  push:
    branches: [main, codacy-remediation]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Ubuntu source gates
    runs-on: ubuntu-latest
    env:
      APPPORT_SOURCE_VERIFICATION: "true"
      APPPORT_RELUTION_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:toolchain
      - run: pnpm format:check
      - run: pnpm docs:verify
      - run: pnpm client:typecheck
      - run: pnpm client:test:coverage
      - run: pnpm client:build
      - run: pnpm client:rust:fmt
      - run: pnpm client:rust:clippy
      - run: pnpm client:rust:test
      - run: pnpm client:rust:check

  windows:
    name: Unsigned qualification MSI candidate
    runs-on: windows-latest
    env:
      # Repository variables are non-secret, approved qualification-tenant build
      # inputs. A missing value fails the release build closed in build.rs.
      APPPORT_RELUTION_API_BASE_URL: ${{ vars.APPPORT_RELUTION_API_BASE_URL }}
      APPPORT_RELUTION_ORGANIZATION_UUID: ${{ vars.APPPORT_RELUTION_ORGANIZATION_UUID }}
      APPPORT_NATIVE_APP_UUID: ${{ vars.APPPORT_NATIVE_APP_UUID }}
      APPPORT_RELUTION_WRITES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - run: pnpm client:tauri -- --target x86_64-pc-windows-msvc
      - run: pnpm client:rust:fmt
      - run: cargo clippy --manifest-path apps/windows-client/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path apps/windows-client/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - run: cargo check --manifest-path apps/windows-client/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Locate MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path apps/windows-client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -Filter *.msi -File -Recurse | Select-Object -First 1
          if ($null -eq $msi) { throw "Tauri did not produce an MSI." }
          $evidenceDirectory = "release-artifacts/0.1.0-alpha.3"
          New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
          $candidateMsi = Join-Path $evidenceDirectory "Appport-0.1.0-alpha.3.msi"
          Copy-Item -LiteralPath $msi.FullName -Destination $candidateMsi -Force
          "APPPORT_MSI=$((Resolve-Path $candidateMsi).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Record unsigned candidate evidence
        run: pnpm alpha:evidence -- --msi $env:APPPORT_MSI
      - name: Require candidate-ready unsigned evidence
        shell: pwsh
        run: |
          $evidence = Get-Content release-artifacts/0.1.0-alpha.3/evidence.json -Raw | ConvertFrom-Json
          if (-not $evidence.candidateReady) { throw "candidateReady must be true for the qualification MSI." }
          if ($evidence.signed -or $evidence.distributable) { throw "alpha.3 evidence must remain unsigned and non-distributable." }
      - name: Upload unsigned candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: appport-0.1.0-alpha.3-unsigned-qualification-candidate
          if-no-files-found: error
          path: |
            release-artifacts/0.1.0-alpha.3/Appport-0.1.0-alpha.3.msi
            release-artifacts/0.1.0-alpha.3/evidence.json
            release-artifacts/0.1.0-alpha.3/msi-sha256.txt
            release-artifacts/0.1.0-alpha.3/source-revision-state.json
            release-artifacts/0.1.0-alpha.3/configuration-fingerprint.json
            release-artifacts/0.1.0-alpha.3/embedded-secret-scan.json
